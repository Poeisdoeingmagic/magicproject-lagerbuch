<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lagerbuch</title>
<meta name="theme-color" content="#16202a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lagerbuch">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <div class="wrap">
    <div class="brand"><i aria-hidden="true"></i>Lagerbuch</div>
    <nav class="tabs" aria-label="Bereiche">
      <a href="#dinge" data-view="dinge">Dinge</a>
      <a href="#orte" data-view="orte">Orte</a>
      <a href="#journal" data-view="journal">Journal</a>
    </nav>
    <button class="sync" id="syncBtn" type="button" title="Jetzt synchronisieren"><span class="dot" id="syncDot"></span><span id="syncText">…</span></button>
  </div>
</header>

<main class="wrap">
  <div id="notices"></div>

  <section id="view-dinge">
    <div class="tools">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Suchen: Name, Kategorie, Schlagwort, Ort …" autocomplete="off" aria-label="Suche">
      </div>
      <select id="fOrt" aria-label="Ort filtern"></select>
      <select id="fKat" aria-label="Kategorie filtern"></select>
    </div>
    <div class="activefilter" id="activeFilter"></div>
    <p class="meta"><span id="countInfo"></span>
      <select id="sort" aria-label="Sortierung" class="mini">
        <option value="name">Sortiert nach Name</option>
        <option value="recent">Zuletzt geändert</option>
        <option value="ort">Nach Ort</option>
      </select>
    </p>
    <div id="dingList"></div>
  </section>

  <section id="view-orte" hidden>
    <div id="ortGroups"></div>
    <h2 class="section-h">Lagerort hinzufügen</h2>
    <form class="addort" id="addOrtForm">
      <input id="newStandort" list="standortList" placeholder="Standort, z. B. PG16" required aria-label="Standort">
      <input id="newBereich" placeholder="Bereich, z. B. Dachboden" required aria-label="Bereich">
      <button class="btn primary" type="submit">Hinzufügen</button>
      <datalist id="standortList"></datalist>
    </form>
    <h2 class="section-h">Einstellungen</h2>
    <div class="settings-row">
      <p class="jby" id="settingsInfo"></p>
      <button class="btn" type="button" id="openSettings">Verbindung &amp; Name ändern</button>
    </div>
  </section>

  <section id="view-journal" hidden>
    <div class="tools two-col">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="jq" type="search" placeholder="Journal durchsuchen: Ding, Ort, Person" autocomplete="off" aria-label="Journal durchsuchen">
      </div>
      <select id="jType" aria-label="Art filtern">
        <option value="">Alle Vorgänge</option>
        <option value="move">Umbuchungen</option>
        <option value="new">Neu angelegt</option>
        <option value="edit">Geändert</option>
        <option value="del">Gelöscht</option>
      </select>
    </div>
    <div id="journalList"></div>
  </section>
</main>

<button class="fab" id="fab" type="button" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Ding erfassen
</button>

<dialog id="dlg"><div class="sheet" id="sheet"></div></dialog>
<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fileLib" accept="image/*" multiple hidden>
<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
